<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Peek-A-Bot</title>
  <defs>
    <!-- macOS icon grid: 824 px body on a 1024 canvas -->
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF7EC"/>
      <stop offset="1" stop-color="#F3E4C6"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FBC8C"/>
      <stop offset="1" stop-color="#6A9B69"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FA6F61"/>
      <stop offset="1" stop-color="#E24E3E"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DAD7B"/>
      <stop offset="1" stop-color="#5A865A"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>

    <!-- inside of the box, behind the head -->
    <rect x="176" y="636" width="672" height="120" rx="56" fill="#B83E33"/>

    <!-- head, peeking up out of the box -->
    <rect x="262" y="262" width="500" height="470" rx="122" fill="url(#head)"/>
    <rect x="306" y="296" width="164" height="36" rx="18" fill="#fff" opacity=".42"/>

    <!-- eyes, looking up and to the right -->
    <ellipse cx="412" cy="470" rx="76" ry="84" fill="#FFFCF3"/>
    <ellipse cx="612" cy="470" rx="76" ry="84" fill="#FFFCF3"/>
    <circle cx="430" cy="455" r="41" fill="#3A2A24"/>
    <circle cx="630" cy="455" r="41" fill="#3A2A24"/>
    <circle cx="442" cy="437" r="13" fill="#fff"/>
    <circle cx="642" cy="437" r="13" fill="#fff"/>

    <!-- a small "oh!" -->
    <ellipse cx="512" cy="604" rx="30" ry="34" fill="#41302A"/>
    <ellipse cx="512" cy="622" rx="19" ry="13" fill="#ED8375"/>

    <!-- front of the box -->
    <ellipse cx="512" cy="700" rx="290" ry="26" fill="#3A332E" opacity=".25" filter="url(#soft)"/>
    <rect x="132" y="688" width="760" height="330" rx="80" fill="url(#box)"/>
    <rect x="180" y="708" width="250" height="28" rx="14" fill="#fff" opacity=".35"/>

    <!-- claws hooked over the rim -->
    <g fill="none" stroke="url(#claw)" stroke-width="42" stroke-linecap="round">
      <path d="M262 726v-14a46 46 0 0 1 92 0v14"/>
      <path d="M670 726v-14a46 46 0 0 1 92 0v14"/>
    </g>
    <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".35">
      <path d="M284 690a26 26 0 0 1 30 -10"/>
      <path d="M692 690a26 26 0 0 1 30 -10"/>
    </g>
  </g>
</svg>
