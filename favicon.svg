<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Peek-A-Bot</title>
  <!-- Simplified mark for 16–32 px: bigger head and eyes, no claws or mouth. -->
  <defs><clipPath id="t"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath></defs>
  <g clip-path="url(#t)">
    <rect x="2" y="2" width="60" height="60" fill="#F8EEDA"/>
    <rect x="11" y="12" width="42" height="40" rx="11" fill="#77A876"/>
    <ellipse cx="24" cy="30" rx="7.5" ry="8.2" fill="#FFFCF3"/>
    <ellipse cx="40" cy="30" rx="7.5" ry="8.2" fill="#FFFCF3"/>
    <circle cx="25.6" cy="28.6" r="4" fill="#3A2A24"/>
    <circle cx="41.6" cy="28.6" r="4" fill="#3A2A24"/>
    <rect x="4" y="44" width="56" height="24" rx="7" fill="#F0604F"/>
  </g>
</svg>
